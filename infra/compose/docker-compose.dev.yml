name: kuuna-dev

services:
  node-deps:
    image: node:22-bookworm
    working_dir: /workspace
    environment:
      CI: "true"
    command: >
      sh -c '
        npm install -g pnpm@10.33.2 >/dev/null &&
        pnpm install
      '
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - dashboard_node_modules:/workspace/apps/dashboard/node_modules
      - dashboard_next:/workspace/apps/dashboard/.next
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
      - gateway_node_modules:/workspace/services/gateway/node_modules

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c 'pnpm --dir apps/dashboard exec next dev --hostname "$${DASHBOARD_BIND_HOST:-::}" --port 3000'
    env_file:
      - path: ../env/dashboard.env.example
      - path: ../env/dashboard.env.local
        required: false
    ports:
      - "${TAILSCALE_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - dashboard_node_modules:/workspace/apps/dashboard/node_modules
    depends_on:
      node-deps:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: services/backend-ts/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c 'pnpm --filter @kuuna/backend-ts dev'
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      HOST: "::"
      PORT: "8000"
      RUNTIME_AGENT_TIMEOUT_SECONDS: ${RUNTIME_AGENT_TIMEOUT_SECONDS:-300}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${TAILSCALE_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      node-deps:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  migrate:
    build:
      context: ../..
      dockerfile: services/backend-ts/Dockerfile.dev
    working_dir: /workspace
    command: sh -c "pnpm --filter @kuuna/backend-ts db:migrate"
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
    depends_on:
      node-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: services/backend-ts/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c 'pnpm --filter @kuuna/backend-ts dev:worker'
    env_file:
      - path: ../env/backend.env.example
      - path: ../env/backend.env.local
        required: false
    environment:
      RUNTIME_AGENT_TIMEOUT_SECONDS: ${RUNTIME_AGENT_TIMEOUT_SECONDS:-300}
      WATCHFILES_FORCE_POLLING: "true"
      TEMPLATE_BUILD_CONTEXT_PATH: /workspace
      TEMPLATE_BUILD_DOCKERFILE_PATH: /workspace/services/runtime-agent-ts/Dockerfile
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - backend_ts_node_modules:/workspace/services/backend-ts/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      node-deps:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile.dev
    working_dir: /workspace
    command: >
      sh -c 'pnpm --filter @kuuna/gateway dev'
    env_file:
      - path: ../env/gateway.env.example
      - path: ../env/gateway.env.local
        required: false
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${TAILSCALE_BIND_IP:-127.0.0.1}:8090:8090"
    volumes:
      - ../..:/workspace
      - workspace_node_modules:/workspace/node_modules
      - gateway_node_modules:/workspace/services/gateway/node_modules
      - gateway_session:/data
    depends_on:
      node-deps:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kuuna
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TAILSCALE_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuuna"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${TAILSCALE_BIND_IP:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    ports:
      - "${TAILSCALE_BIND_IP:-127.0.0.1}:9000:9000"
      - "${TAILSCALE_BIND_IP:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  dashboard_node_modules:
  dashboard_next:
  workspace_node_modules:
  backend_ts_node_modules:
  gateway_node_modules:
  gateway_session:
  postgres_data:
  minio_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
